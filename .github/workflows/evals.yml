name: evals
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to evaluate (blank = all)"
        required: false
        default: ""
      max_cost:
        description: "Per-plugin cost ceiling (USD)"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  eval:
    name: evals / ${{ inputs.plugin || 'all' }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Evals
        run: make eval ONLY="$PLUGIN" EVAL_MAX_COST="$MAX_COST"
        env:
          PLUGIN: ${{ inputs.plugin }}
          MAX_COST: ${{ inputs.max_cost }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: plugins/*/evals/results/
