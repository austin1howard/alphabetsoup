version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - nakedret
    - noctx
    - revive
    - sqlclosecheck
    - unparam
  exclusions:
    rules:
      - path: _test\.go
        linters: [noctx, gosec]
formatters:
  enable:
    - gofmt
    - goimports
