# Include only the services this repo has.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    ports: ["8000:8000"]   # Go listens on 8080 → "8000:8080"
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [backend]

volumes:
  db-data:
