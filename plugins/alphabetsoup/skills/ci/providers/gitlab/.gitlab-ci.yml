# Skeleton. Repeat the .<<d>> template + <<d>>:* jobs per domain. Single-stack: drop `cd`,
# `changes:` rules, and the "<<d>>" prefix; image path drops "/<<d>>". Pin images to exact tags.
stages: [lint, typecheck, test, build, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

.<<d>>:
  image: <<recipe: image>>
  cache: <<recipe: cache>>
  before_script:
    - cd <<d>>
    - <<recipe: install make if needed>>
    - make setup
  rules:
    - if: $CI_COMMIT_TAG
    - changes: [<<d>>/**/*, .gitlab-ci.yml]

<<d>>:lint:
  extends: .<<d>>
  stage: lint
  needs: []
  script: [make lint]

<<d>>:typecheck:              # omit when recipe says no typecheck
  extends: .<<d>>
  stage: typecheck
  needs: []
  script: [make typecheck]

<<d>>:test:
  extends: .<<d>>
  stage: test
  needs: []
  services:                   # only when the domain uses Postgres
    - name: postgres:18-alpine
      alias: db
  variables:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
    DATABASE_URL: postgresql://app:app@db:5432/app
  script: [make test]
  artifacts:
    when: always
    paths: [<<d>>/reports/]
    reports:
      junit: <<d>>/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: <<d>>/<<recipe: coverage file>>

.<<d>>-docker:
  image: docker:<<version>>
  services: [docker:<<version>>-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - apk add --no-cache make
    - cd <<d>>

<<d>>:build:                  # omit for domains without docker-build
  extends: .<<d>>-docker
  stage: build
  needs: [<<d>>:lint, <<d>>:typecheck, <<d>>:test]
  rules:
    - if: $CI_COMMIT_TAG
    - changes: [<<d>>/**/*, .gitlab-ci.yml]
  script:
    - make docker-build IMAGE=$CI_REGISTRY_IMAGE/<<d>>:$CI_COMMIT_SHORT_SHA

<<d>>:release:
  extends: .<<d>>-docker
  stage: release
  needs: [<<d>>:build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - VERSION="${CI_COMMIT_TAG#v}"
    - make docker-build IMAGE=$CI_REGISTRY_IMAGE/<<d>>:$VERSION
    - docker tag $CI_REGISTRY_IMAGE/<<d>>:$VERSION $CI_REGISTRY_IMAGE/<<d>>:latest
    - docker push $CI_REGISTRY_IMAGE/<<d>>:$VERSION
    - docker push $CI_REGISTRY_IMAGE/<<d>>:latest
